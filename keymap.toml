[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore preview"

[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin smart-filter"
desc = "Smart filter"

[[mgr.prepend_keymap]]
on   = ["g", "D"]
run  = "cd /mnt/d"
desc = "Go to D drive"

[[mgr.prepend_keymap]]
on   = "i"
run  = "plugin searchjump"
desc = "Search & jump (pinyin supported)"

[[mgr.prepend_keymap]]
on   = "Y"
run  = "unyank"
desc = "Cancel yank"
