# --- codex yazi ijkl navigation start ---
[[mgr.prepend_keymap]]
on = "i"
run = "arrow -1"
desc = "Move cursor up"

[[mgr.prepend_keymap]]
on = "j"
run = "leave"
desc = "Go back to parent directory"

[[mgr.prepend_keymap]]
on = "k"
run = "arrow 1"
desc = "Move cursor down"

[[mgr.prepend_keymap]]
on = "l"
run = "plugin smart-enter"
desc = "Enter directory or open file"

[[mgr.prepend_keymap]]
on = "h"
run = "plugin searchjump"
desc = "Searchjump"
# --- codex yazi ijkl navigation end ---

[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore preview"

[[mgr.prepend_keymap]]
on   = "F"
run  = "plugin smart-filter"
desc = "Smart filter"

[[mgr.prepend_keymap]]
on   = ["g", "D"]
run  = "cd /mnt/d"
desc = "Go to D drive"

[[mgr.prepend_keymap]]
on   = "Y"
run  = "unyank"
desc = "Cancel yank"
